<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Canlı Mor - Pembe Gradyan -->
    <linearGradient id="msInfinityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    
    <!-- Parlama Filtresi -->
    <filter id="msGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arka Plan Gradyanı -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24103a" />
      <stop offset="100%" stop-color="#12061f" />
    </linearGradient>
  </defs>

  <!-- Arka Plan Yuvarlatılmış Kare Rozet -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="3"/>

  <!-- Geometrik İnce Arka Plan Halkası -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(168, 85, 247, 0.15)" stroke-width="2" stroke-dasharray="4 6" />

  <!-- M & S Sonsuzluk (Infinity) Dinamik Formu -->
  <g filter="url(#msGlow)">
    <!-- Sonsuzluk Çift Döngüsü & M-S Kıvrımı -->
    <path d="M 65 130 
             C 40 130, 25 115, 25 100 
             C 25 85, 40 70, 65 70 
             C 90 70, 110 130, 135 130 
             C 160 130, 175 115, 175 100 
             C 175 85, 160 70, 135 70 
             C 110 70, 90 130, 65 130 Z" 
          fill="none" 
          stroke="url(#msInfinityGrad)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- 'M' Harfi Sol Tepe Detayları -->
    <path d="M 45 118 L 45 82 L 65 102 L 85 82 L 85 118" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.95"/>

    <!-- 'S' Harfi Sağ Kıvrım Detayları -->
    <path d="M 148 85 
             C 125 82, 122 96, 135 100 
             C 148 104, 145 118, 122 116" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.95"/>
  </g>

  <!-- Parıltı Yıldızları -->
  <path d="M 160 55 Q 160 65 170 65 Q 160 65 160 75 Q 160 65 150 65 Q 160 65 160 55 Z" fill="#ec4899" />
  <circle cx="38" cy="148" r="3" fill="#38bdf8" />
</svg>
