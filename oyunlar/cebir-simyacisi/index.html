<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cebir Simyacısı: Büyü Laboratuvarı | Merve Samak Akademi</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Orbitron:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  
  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 15%, #3b0764 0%, #19062e 55%, #080210 100%);
      min-height: 100vh;
      color: #f1f5f9;
      user-select: none;
    }
    .font-fredoka { font-family: 'Fredoka', cursive, sans-serif; }
    .potion-glow {
      box-shadow: 0 0 30px rgba(192, 132, 252, 0.4), inset 0 0 20px rgba(236, 72, 153, 0.25);
    }
    .potion-card {
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .potion-card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 30px rgba(192, 132, 252, 0.5);
    }
    .potion-card:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body class="flex flex-col justify-between min-h-screen p-3 sm:p-5">

  <!-- TOP HUD -->
  <header class="max-w-5xl mx-auto w-full flex items-center justify-between gap-3 bg-slate-900/90 border border-purple-500/30 p-3 rounded-2xl backdrop-blur-md shadow-xl">
    <div class="flex items-center gap-3">
      <a href="../index.html" class="px-3 py-1.5 rounded-xl bg-purple-900/40 hover:bg-purple-800 text-purple-200 text-xs font-bold border border-purple-500/30 flex items-center gap-1.5 transition-all">
        <span>◀</span> Portala Dön
      </a>
      <div>
        <span class="text-[10px] text-pink-400 font-bold uppercase tracking-wider block font-fredoka">MERVE SAMAK AKADEMİ</span>
        <h1 class="text-sm sm:text-base font-extrabold text-white font-fredoka flex items-center gap-1.5">
          🧪 Cebir Simyacısı <span id="level-pill" class="text-[10px] px-2 py-0.5 rounded-md bg-purple-500/20 text-purple-300 border border-purple-500/40">Seviye 1</span>
        </h1>
      </div>
    </div>

    <!-- Stats -->
    <div class="flex items-center gap-2 sm:gap-4 text-xs font-bold">
      <div class="bg-slate-950/80 px-3 py-1.5 rounded-xl border border-purple-500/20 text-purple-300">
        Simya Gücü: <span id="hud-score" class="text-amber-400 font-extrabold text-sm">0</span>
      </div>
      <div class="bg-slate-950/80 px-3 py-1.5 rounded-xl border border-purple-500/20 text-purple-300">
        İksir: <span id="hud-potions" class="text-purple-300 font-extrabold text-sm">0 🧪</span>
      </div>
    </div>
  </header>

  <!-- MAIN GAME AREA -->
  <main class="max-w-4xl mx-auto w-full my-auto py-4">
    <div id="game-card" class="bg-slate-900/85 border-2 border-purple-500/40 rounded-3xl p-5 sm:p-8 backdrop-blur-xl potion-glow relative overflow-hidden">
      
      <!-- Progress Bar -->
      <div class="w-full bg-slate-950/80 h-2.5 rounded-full overflow-hidden mb-6 border border-purple-500/30">
        <div id="progress-bar" class="bg-gradient-to-r from-purple-500 via-pink-500 to-amber-400 h-full transition-all duration-500" style="width: 15%;"></div>
      </div>

      <!-- Question Title / Context -->
      <div class="text-center space-y-2 mb-6">
        <div id="stage-badge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-purple-500/20 border border-purple-500/40 text-purple-300 text-xs font-bold">
          🔮 İksir Kazanı & Özdeşlikler
        </div>
        <h2 id="question-text" class="text-xl sm:text-2xl font-black text-white leading-snug">
          <!-- JS doldurur -->
        </h2>
        <p id="question-sub" class="text-xs sm:text-sm text-purple-200">Kazan için doğru cebirsel özdeşliği seç ve iksiri tamamla!</p>
      </div>

      <!-- Interactive Options Grid -->
      <div id="options-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 sm:gap-4 my-6">
        <!-- JS render -->
      </div>

      <!-- Feedback Banner -->
      <div id="feedback-banner" class="hidden p-4 rounded-2xl border text-center text-sm font-bold space-y-2 animate-fadeIn">
        <div id="feedback-msg"></div>
        <div id="feedback-explanation" class="text-xs text-slate-300 font-normal"></div>
        <button id="next-btn" onclick="nextQuestion()" class="mt-3 px-6 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 hover:brightness-110 text-white font-bold text-xs shadow-lg transition-all">
          Sonraki Büyü Formülüne Geç ➔
        </button>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="max-w-4xl mx-auto w-full text-center py-2 text-xs text-slate-400 font-medium">
    Merve Samak Akademi • 8. Sınıf LGS Cebirsel İfadeler & Özdeşlikler Tematik Eğitsel Oyunu
  </footer>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }
    function playCorrectSound() {
      playBeep(392, 'sine', 0.1);
      setTimeout(() => playBeep(523.25, 'sine', 0.12), 100);
      setTimeout(() => playBeep(783.99, 'triangle', 0.25), 200);
    }
    function playWrongSound() {
      playBeep(200, 'sawtooth', 0.2);
      setTimeout(() => playBeep(140, 'sawtooth', 0.3), 150);
    }

    const QUESTIONS = [
      {
        stage: "Seviye 1: Terimler ve Benzer Terimler",
        text: "$4x^2 - 7x + 9$ cebirsel ifadesinin sabit terimi ile katsayılar toplamı sırasıyla hangisidir?",
        options: ["$9$ ve $6$", "$9$ ve $20$", "$-7$ ve $6$", "$9$ ve $-7$"],
        correct: 0,
        exp: "Sabit terim $= 9$. Katsayılar: $4, -7, 9$. Katsayılar toplamı $= 4 + (-7) + 9 = 6$ olur."
      },
      {
        stage: "Seviye 1: Çarpmanın Dağılma Özelliği",
        text: "$2x \\cdot (3x - 5)$ cebirsel çarpımının eşiti aşağıdakilerden hangisidir?",
        options: ["$6x^2 - 5$", "$5x^2 - 10x$", "$6x^2 - 10x$", "$6x - 10$"],
        correct: 2,
        exp: "$2x \\cdot 3x = 6x^2$ ve $2x \\cdot (-5) = -10x$. Sonuç: $6x^2 - 10x$'dir."
      },
      {
        stage: "Seviye 2: Tam Kare Özdeşliği",
        text: "$(2x + 3)^2$ ifadesinin özdeşi olan iksir formülü hangisidir?",
        options: [
          "$4x^2 + 9$",
          "$4x^2 + 6x + 9$",
          "$4x^2 + 12x + 9$",
          "$2x^2 + 12x + 6$"
        ],
        correct: 2,
        exp: "$(a+b)^2 = a^2 + 2ab + b^2$. Burada $(2x)^2 + 2(2x)(3) + 3^2 = 4x^2 + 12x + 9$'dur."
      },
      {
        stage: "Seviye 2: İki Kare Farkı Özdeşliği",
        text: "$x^2 - 49$ ifadesinin çarpanlarına ayrılmış hali hangisidir?",
        options: [
          "$(x - 7)^2$",
          "$(x - 7)(x + 7)$",
          "$(x - 49)(x + 1)$",
          "$(x - 7)(x - 7)$"
        ],
        correct: 1,
        exp: "$a^2 - b^2 = (a-b)(a+b)$ kuralından $x^2 - 7^2 = (x-7)(x+7)$'dir."
      },
      {
        stage: "Seviye 3: Ortak Çarpan Parantezi",
        text: "$6a^2b - 9ab^2$ ifadesinin en sade çarpanlarına ayrılmış şekli hangisidir?",
        options: [
          "$3ab(2a - 3b)$",
          "$3ab(2a + 3b)$",
          "$6ab(a - b)$",
          "$3(2a^2b - 3ab^2)$"
        ],
        correct: 0,
        exp: "EBOB$(6, 9) = 3$ ve ortak harfler $ab$. Paranteze alınırsa: $3ab(2a - 3b)$ bulunur."
      },
      {
        stage: "Seviye 4: LGS Baş Simyacı Görevi",
        text: "Alanı $(9x^2 - 24x + 16) \\text{ cm}^2$ olan kare şeklindeki sihirli aynanın çevre uzunluğu kaç cm'dir?",
        options: [
          "$3x - 4$",
          "$6x - 8$",
          "$12x - 16$",
          "$12x + 16$"
        ],
        correct: 2,
        exp: "$9x^2 - 24x + 16 = (3x - 4)^2$. Bir kenar $= 3x - 4$. Çevre $= 4(3x - 4) = 12x - 16$ cm'dir."
      }
    ];

    let currentQ = 0;
    let score = 0;
    let potions = 0;
    let answered = false;

    function renderCurrentQuestion() {
      answered = false;
      const q = QUESTIONS[currentQ];
      
      document.getElementById('stage-badge').innerHTML = `🔮 ${q.stage}`;
      document.getElementById('question-text').innerHTML = q.text;
      document.getElementById('level-pill').innerText = `Soru ${currentQ + 1} / ${QUESTIONS.length}`;
      
      const pct = Math.round(((currentQ + 1) / QUESTIONS.length) * 100);
      document.getElementById('progress-bar').style.width = `${pct}%`;

      const fb = document.getElementById('feedback-banner');
      fb.classList.add('hidden');

      const grid = document.getElementById('options-grid');
      grid.innerHTML = q.options.map((opt, i) => `
        <button onclick="handleSelect(${i})" class="potion-card p-4 sm:p-5 rounded-2xl bg-purple-950/70 border border-purple-500/30 text-white font-bold text-left flex items-center gap-3">
          <span class="w-8 h-8 rounded-xl bg-purple-900/80 border border-purple-400/40 text-purple-300 flex items-center justify-center text-xs shrink-0 font-fredoka">
            ${['A', 'B', 'C', 'D'][i]}
          </span>
          <span class="text-sm sm:text-base flex-1">${opt}</span>
        </button>
      `).join('');

      renderMath();
    }

    function handleSelect(index) {
      if (answered) return;
      answered = true;
      const q = QUESTIONS[currentQ];
      const isCorrect = (index === q.correct);
      const fb = document.getElementById('feedback-banner');
      const msg = document.getElementById('feedback-msg');
      const exp = document.getElementById('feedback-explanation');

      fb.classList.remove('hidden');

      if (isCorrect) {
        playCorrectSound();
        score += 35;
        potions += 1;
        document.getElementById('hud-score').innerText = score;
        document.getElementById('hud-potions').innerText = `${potions} 🧪`;
        
        fb.className = "p-4 rounded-2xl border text-center text-sm font-bold space-y-2 bg-emerald-950/80 border-emerald-500 text-emerald-300 animate-fadeIn";
        msg.innerHTML = "✨ İksir Başarıyla Mayalandı! Simya Gücün Yükseldi!";
        confetti({ particleCount: 45, spread: 75, origin: { y: 0.7 } });
      } else {
        playWrongSound();
        fb.className = "p-4 rounded-2xl border text-center text-sm font-bold space-y-2 bg-rose-950/80 border-rose-500 text-rose-300 animate-fadeIn";
        msg.innerHTML = `⚠️ Kazan Taştı! Doğru Özdeşlik: ${['A', 'B', 'C', 'D'][q.correct]}`;
      }

      exp.innerHTML = `<strong>Cebirsel Açıklama:</strong> ${q.exp}`;
      renderMath();
    }

    function nextQuestion() {
      currentQ++;
      if (currentQ < QUESTIONS.length) {
        renderCurrentQuestion();
      } else {
        showGameOver();
      }
    }

    function showGameOver() {
      confetti({ particleCount: 140, spread: 95, origin: { y: 0.6 } });
      const card = document.getElementById('game-card');
      card.innerHTML = `
        <div class="text-center space-y-5 py-6">
          <div class="text-6xl animate-bounce">🧪</div>
          <h2 class="text-3xl font-black text-white font-fredoka">Baş Simyacı Unvanı!</h2>
          <p class="text-purple-200 text-sm max-w-md mx-auto">
            Tebrikler! Cebirsel modellemeleri, tam kare özdeşliklerini ve iki kare farkını ustaca kullanarak simya laboratuvarını fethettin.
          </p>
          <div class="inline-flex items-center gap-6 p-4 rounded-2xl bg-purple-950/70 border border-purple-500/40">
            <div>
              <div class="text-xs text-purple-400">Toplam Simya Gücü</div>
              <div class="text-2xl font-black text-amber-400">${score}</div>
            </div>
            <div class="w-px h-8 bg-purple-500/30"></div>
            <div>
              <div class="text-xs text-purple-400">Üretilen İksir</div>
              <div class="text-2xl font-black text-pink-400">${potions} / ${QUESTIONS.length} 🧪</div>
            </div>
          </div>
          <div class="flex flex-wrap items-center justify-center gap-3 pt-4">
            <button onclick="location.reload()" class="px-5 py-3 rounded-2xl bg-gradient-to-r from-purple-600 via-pink-600 to-amber-500 hover:brightness-110 text-white font-bold text-xs shadow-lg transition-all">
              🔄 Yeniden Oyna
            </button>
            <a href="../index.html" class="px-5 py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-purple-200 font-bold text-xs border border-purple-500/30 transition-all">
              🎮 Diğer Oyunları Keşfet
            </a>
          </div>
        </div>
      `;
      renderMath();
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderCurrentQuestion();
    });
  </script>
</body>
</html>
