<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hız Treni Mühendisi: Eğim Dağı | Merve Samak Akademi</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Orbitron:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  
  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 15%, #0369a1 0%, #0c2842 50%, #04101d 100%);
      min-height: 100vh;
      color: #f1f5f9;
      user-select: none;
    }
    .font-fredoka { font-family: 'Fredoka', cursive, sans-serif; }
    .rail-glow {
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.4), inset 0 0 20px rgba(245, 158, 11, 0.2);
    }
    .rail-card {
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .rail-card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.5);
    }
    .rail-card:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body class="flex flex-col justify-between min-h-screen p-3 sm:p-5">

  <!-- TOP HUD -->
  <header class="max-w-5xl mx-auto w-full flex items-center justify-between gap-3 bg-slate-900/90 border border-sky-500/30 p-3 rounded-2xl backdrop-blur-md shadow-xl">
    <div class="flex items-center gap-3">
      <a href="../index.html" class="px-3 py-1.5 rounded-xl bg-sky-900/40 hover:bg-sky-800 text-sky-200 text-xs font-bold border border-sky-500/30 flex items-center gap-1.5 transition-all">
        <span>◀</span> Portala Dön
      </a>
      <div>
        <span class="text-[10px] text-amber-400 font-bold uppercase tracking-wider block font-fredoka">MERVE SAMAK AKADEMİ</span>
        <h1 class="text-sm sm:text-base font-extrabold text-white font-fredoka flex items-center gap-1.5">
          🎢 Hız Treni Mühendisi <span id="level-pill" class="text-[10px] px-2 py-0.5 rounded-md bg-sky-500/20 text-sky-300 border border-sky-500/40">Seviye 1</span>
        </h1>
      </div>
    </div>

    <!-- Stats -->
    <div class="flex items-center gap-2 sm:gap-4 text-xs font-bold">
      <div class="bg-slate-950/80 px-3 py-1.5 rounded-xl border border-sky-500/20 text-sky-300">
        Mühendislik: <span id="hud-score" class="text-amber-400 font-extrabold text-sm">0</span>
      </div>
      <div class="bg-slate-950/80 px-3 py-1.5 rounded-xl border border-sky-500/20 text-sky-300">
        Rampa: <span id="hud-ramps" class="text-sky-300 font-extrabold text-sm">0 🎢</span>
      </div>
    </div>
  </header>

  <!-- MAIN GAME AREA -->
  <main class="max-w-4xl mx-auto w-full my-auto py-4">
    <div id="game-card" class="bg-slate-900/85 border-2 border-sky-500/40 rounded-3xl p-5 sm:p-8 backdrop-blur-xl rail-glow relative overflow-hidden">
      
      <!-- Progress Bar -->
      <div class="w-full bg-slate-950/80 h-2.5 rounded-full overflow-hidden mb-6 border border-sky-500/30">
        <div id="progress-bar" class="bg-gradient-to-r from-sky-500 via-cyan-400 to-amber-400 h-full transition-all duration-500" style="width: 15%;"></div>
      </div>

      <!-- Question Title / Context -->
      <div class="text-center space-y-2 mb-6">
        <div id="stage-badge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-sky-500/20 border border-sky-500/40 text-sky-300 text-xs font-bold">
          📐 Rampa Eğimi & Koordinat
        </div>
        <h2 id="question-text" class="text-xl sm:text-2xl font-black text-white leading-snug">
          <!-- JS doldurur -->
        </h2>
        <p id="question-sub" class="text-xs sm:text-sm text-sky-200">Tren rayının güvenli geçişi için doğru denklemi ve eğimi belirle!</p>
      </div>

      <!-- Interactive Options Grid -->
      <div id="options-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 sm:gap-4 my-6">
        <!-- JS render -->
      </div>

      <!-- Feedback Banner -->
      <div id="feedback-banner" class="hidden p-4 rounded-2xl border text-center text-sm font-bold space-y-2 animate-fadeIn">
        <div id="feedback-msg"></div>
        <div id="feedback-explanation" class="text-xs text-slate-300 font-normal"></div>
        <button id="next-btn" onclick="nextQuestion()" class="mt-3 px-6 py-2.5 rounded-xl bg-gradient-to-r from-sky-600 to-cyan-500 hover:brightness-110 text-white font-bold text-xs shadow-lg transition-all">
          Sonraki Dağ Rampasına Geç ➔
        </button>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="max-w-4xl mx-auto w-full text-center py-2 text-xs text-slate-400 font-medium">
    Merve Samak Akademi • 8. Sınıf LGS Doğrusal Denklemler & Eğim Tematik Eğitsel Oyunu
  </footer>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }
    function playCorrectSound() {
      playBeep(440, 'triangle', 0.1);
      setTimeout(() => playBeep(554.37, 'triangle', 0.12), 90);
      setTimeout(() => playBeep(880, 'triangle', 0.25), 180);
    }
    function playWrongSound() {
      playBeep(210, 'sawtooth', 0.2);
      setTimeout(() => playBeep(160, 'sawtooth', 0.3), 150);
    }

    const QUESTIONS = [
      {
        stage: "Seviye 1: Koordinat Sistemi Bölgeleri",
        text: "$A(-4, 7)$ noktası koordinat sisteminde kaçıncı bölgededir?",
        options: ["1. Bölge", "2. Bölge", "3. Bölge", "4. Bölge"],
        correct: 1,
        exp: "$x < 0$ ve $y > 0$ olan noktalar 2. bölgededir."
      },
      {
        stage: "Seviye 1: Eksenleri Kestiği Noktalar",
        text: "$2x - 3y = 12$ doğrusunun $y$ eksenini kestiği noktanın ordinatı ($y$ değeri) kaçtır?",
        options: ["$6$", "$4$", "$-4$", "$-6$"],
        correct: 2,
        exp: "$y$ eksenini kestiği noktada $x = 0$ olur. $2(0) - 3y = 12 \\implies -3y = 12 \\implies y = -4$ bulunur."
      },
      {
        stage: "Seviye 2: Rampa Eğimi Hesabı",
        text: "Dikey yüksekliği $6$ metre, yatay uzunluğu $15$ metre olan bir hız treni rampasının eğimi yüzde kaçtır?",
        options: ["$\\%25$", "$\\%40$", "$\\%50$", "$\\%60$"],
        correct: 1,
        exp: "$\\text{Eğim} = \\frac{\\text{Dikey}}{\\text{Yatay}} = \\frac{6}{15} = \\frac{2}{5} = \\frac{40}{100} = \\%40$'tır."
      },
      {
        stage: "Seviye 2: Doğrunun Denklemi ve Eğim",
        text: "$y = -3x + 8$ doğrusunun eğimi kaçtır?",
        options: ["$-3$", "$3$", "$8$", "$\\frac{8}{3}$"],
        correct: 0,
        exp: "$y = mx + n$ formundaki doğrularda $x$'in katsayısı olan $m$ eğimdir. Eğim $= -3$'tür."
      },
      {
        stage: "Seviye 3: İki Noktadan Geçen Doğrunun Eğimi",
        text: "$K(2, 3)$ ve $L(6, 11)$ noktalarından geçen tren rayının eğimi kaçtır?",
        options: ["$1$", "$2$", "$3$", "$4$"],
        correct: 1,
        exp: "$m = \\frac{y_2 - y_1}{x_2 - x_1} = \\frac{11 - 3}{6 - 2} = \\frac{8}{4} = 2$'dir."
      },
      {
        stage: "Seviye 4: LGS Şampiyon Mühendis",
        text: "Deposu $60$ litre benzin alan bir araç saatte $4$ litre benzin harcamaktadır. Geçen süre $x$ saat ve depoda kalan benzin $y$ litre olduğuna göre aralarındaki doğrusal ilişki denklemi hangisidir?",
        options: [
          "$y = 60 + 4x$",
          "$y = 60 - 4x$",
          "$y = 4x - 60$",
          "$x = 60 - 4y$"
        ],
        correct: 1,
        exp: "Başlangıçta $60$ litre var ve her saat $4x$ litre azalır. O halde kalan benzin $y = 60 - 4x$ olur."
      }
    ];

    let currentQ = 0;
    let score = 0;
    let ramps = 0;
    let answered = false;

    function renderCurrentQuestion() {
      answered = false;
      const q = QUESTIONS[currentQ];
      
      document.getElementById('stage-badge').innerHTML = `📐 ${q.stage}`;
      document.getElementById('question-text').innerHTML = q.text;
      document.getElementById('level-pill').innerText = `Soru ${currentQ + 1} / ${QUESTIONS.length}`;
      
      const pct = Math.round(((currentQ + 1) / QUESTIONS.length) * 100);
      document.getElementById('progress-bar').style.width = `${pct}%`;

      const fb = document.getElementById('feedback-banner');
      fb.classList.add('hidden');

      const grid = document.getElementById('options-grid');
      grid.innerHTML = q.options.map((opt, i) => `
        <button onclick="handleSelect(${i})" class="rail-card p-4 sm:p-5 rounded-2xl bg-sky-950/70 border border-sky-500/30 text-white font-bold text-left flex items-center gap-3">
          <span class="w-8 h-8 rounded-xl bg-sky-900/80 border border-sky-400/40 text-sky-300 flex items-center justify-center text-xs shrink-0 font-fredoka">
            ${['A', 'B', 'C', 'D'][i]}
          </span>
          <span class="text-sm sm:text-base flex-1">${opt}</span>
        </button>
      `).join('');

      renderMath();
    }

    function handleSelect(index) {
      if (answered) return;
      answered = true;
      const q = QUESTIONS[currentQ];
      const isCorrect = (index === q.correct);
      const fb = document.getElementById('feedback-banner');
      const msg = document.getElementById('feedback-msg');
      const exp = document.getElementById('feedback-explanation');

      fb.classList.remove('hidden');

      if (isCorrect) {
        playCorrectSound();
        score += 35;
        ramps += 1;
        document.getElementById('hud-score').innerText = score;
        document.getElementById('hud-ramps').innerText = `${ramps} 🎢`;
        
        fb.className = "p-4 rounded-2xl border text-center text-sm font-bold space-y-2 bg-emerald-950/80 border-emerald-500 text-emerald-300 animate-fadeIn";
        msg.innerHTML = "⚡ Rampa Kusursuz Kuruldu! Tren Zirveye Ulaştı!";
        confetti({ particleCount: 45, spread: 75, origin: { y: 0.7 } });
      } else {
        playWrongSound();
        fb.className = "p-4 rounded-2xl border text-center text-sm font-bold space-y-2 bg-rose-950/80 border-rose-500 text-rose-300 animate-fadeIn";
        msg.innerHTML = `⚠️ Raylar Birleşmedi! Doğru Cevap: ${['A', 'B', 'C', 'D'][q.correct]}`;
      }

      exp.innerHTML = `<strong>Mühendislik Çözümü:</strong> ${q.exp}`;
      renderMath();
    }

    function nextQuestion() {
      currentQ++;
      if (currentQ < QUESTIONS.length) {
        renderCurrentQuestion();
      } else {
        showGameOver();
      }
    }

    function showGameOver() {
      confetti({ particleCount: 140, spread: 95, origin: { y: 0.6 } });
      const card = document.getElementById('game-card');
      card.innerHTML = `
        <div class="text-center space-y-5 py-6">
          <div class="text-6xl animate-bounce">🎢</div>
          <h2 class="text-3xl font-black text-white font-fredoka">Baş Mühendis Madalyası!</h2>
          <p class="text-sky-200 text-sm max-w-md mx-auto">
            Tebrikler! Doğrusal grafik çizimlerini, eksen kesim noktalarını ve eğim analizlerini hatasız tamamlayarak Eğim Dağı hız trenini bitirdin.
          </p>
          <div class="inline-flex items-center gap-6 p-4 rounded-2xl bg-sky-950/70 border border-sky-500/40">
            <div>
              <div class="text-xs text-sky-400">Toplam Mühendislik Puanı</div>
              <div class="text-2xl font-black text-amber-400">${score}</div>
            </div>
            <div class="w-px h-8 bg-sky-500/30"></div>
            <div>
              <div class="text-xs text-sky-400">Tamamlanan Rampa</div>
              <div class="text-2xl font-black text-cyan-300">${ramps} / ${QUESTIONS.length} 🎢</div>
            </div>
          </div>
          <div class="flex flex-wrap items-center justify-center gap-3 pt-4">
            <button onclick="location.reload()" class="px-5 py-3 rounded-2xl bg-gradient-to-r from-sky-600 to-cyan-500 hover:brightness-110 text-white font-bold text-xs shadow-lg transition-all">
              🔄 Yeniden Oyna
            </button>
            <a href="../index.html" class="px-5 py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-sky-200 font-bold text-xs border border-sky-500/30 transition-all">
              🎮 Diğer Oyunları Keşfet
            </a>
          </div>
        </div>
      `;
      renderMath();
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderCurrentQuestion();
    });
  </script>
</body>
</html>
