<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Piramit Mimarı: Geometri Krallığı | Merve Samak Akademi</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Orbitron:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  
  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 15%, #9a3412 0%, #351307 50%, #110502 100%);
      min-height: 100vh;
      color: #ffedd5;
      user-select: none;
    }
    .font-fredoka { font-family: 'Fredoka', cursive, sans-serif; }
    .pyramid-glow {
      box-shadow: 0 0 30px rgba(249, 115, 22, 0.4), inset 0 0 20px rgba(234, 179, 8, 0.25);
    }
    .pyramid-card {
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .pyramid-card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 30px rgba(249, 115, 22, 0.5);
    }
    .pyramid-card:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body class="flex flex-col justify-between min-h-screen p-3 sm:p-5">

  <!-- TOP HUD -->
  <header class="max-w-5xl mx-auto w-full flex items-center justify-between gap-3 bg-slate-900/90 border border-orange-500/30 p-3 rounded-2xl backdrop-blur-md shadow-xl">
    <div class="flex items-center gap-3">
      <a href="../index.html" class="px-3 py-1.5 rounded-xl bg-orange-950/60 hover:bg-orange-900 text-orange-200 text-xs font-bold border border-orange-500/30 flex items-center gap-1.5 transition-all">
        <span>◀</span> Portala Dön
      </a>
      <div>
        <span class="text-[10px] text-amber-400 font-bold uppercase tracking-wider block font-fredoka">MERVE SAMAK AKADEMİ</span>
        <h1 class="text-sm sm:text-base font-extrabold text-white font-fredoka flex items-center gap-1.5">
          📐 Piramit Mimarı <span id="level-pill" class="text-[10px] px-2 py-0.5 rounded-md bg-orange-500/20 text-orange-300 border border-orange-500/40">Seviye 1</span>
        </h1>
      </div>
    </div>

    <!-- Stats -->
    <div class="flex items-center gap-2 sm:gap-4 text-xs font-bold">
      <div class="bg-slate-950/80 px-3 py-1.5 rounded-xl border border-orange-500/20 text-orange-300">
        Mimarlık Puanı: <span id="hud-score" class="text-amber-400 font-extrabold text-sm">0</span>
      </div>
      <div class="bg-slate-950/80 px-3 py-1.5 rounded-xl border border-orange-500/20 text-orange-300">
        Piramit Katı: <span id="hud-floors" class="text-orange-400 font-extrabold text-sm">0 🏛️</span>
      </div>
    </div>
  </header>

  <!-- MAIN GAME AREA -->
  <main class="max-w-4xl mx-auto w-full my-auto py-4">
    <div id="game-card" class="bg-slate-900/85 border-2 border-orange-500/40 rounded-3xl p-5 sm:p-8 backdrop-blur-xl pyramid-glow relative overflow-hidden">
      
      <!-- Progress Bar -->
      <div class="w-full bg-slate-950/80 h-2.5 rounded-full overflow-hidden mb-6 border border-orange-500/30">
        <div id="progress-bar" class="bg-gradient-to-r from-orange-500 via-amber-400 to-yellow-300 h-full transition-all duration-500" style="width: 15%;"></div>
      </div>

      <!-- Question Title / Context -->
      <div class="text-center space-y-2 mb-6">
        <div id="stage-badge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-orange-500/20 border border-orange-500/40 text-orange-300 text-xs font-bold">
          🏗️ Pisagor & Üçgen Çizimi
        </div>
        <h2 id="question-text" class="text-xl sm:text-2xl font-black text-white leading-snug">
          <!-- JS doldurur -->
        </h2>
        <p id="question-sub" class="text-xs sm:text-sm text-orange-200">Piramidin taşlarını yerine koymak için doğru geometrik bağıntıyı seç!</p>
      </div>

      <!-- Interactive Options Grid -->
      <div id="options-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 sm:gap-4 my-6">
        <!-- JS render -->
      </div>

      <!-- Feedback Banner -->
      <div id="feedback-banner" class="hidden p-4 rounded-2xl border text-center text-sm font-bold space-y-2 animate-fadeIn">
        <div id="feedback-msg"></div>
        <div id="feedback-explanation" class="text-xs text-slate-300 font-normal"></div>
        <button id="next-btn" onclick="nextQuestion()" class="mt-3 px-6 py-2.5 rounded-xl bg-gradient-to-r from-orange-600 via-amber-500 to-yellow-400 hover:brightness-110 text-slate-950 font-black text-xs shadow-lg transition-all">
          Sonraki Piramit Katına Çık ➔
        </button>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="max-w-4xl mx-auto w-full text-center py-2 text-xs text-orange-300/80 font-medium">
    Merve Samak Akademi • 8. Sınıf LGS Üçgenler, Eşlik, Benzerlik & Pisagor Tematik Eğitsel Oyunu
  </footer>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }
    function playCorrectSound() {
      playBeep(440, 'triangle', 0.1);
      setTimeout(() => playBeep(554.37, 'triangle', 0.12), 100);
      setTimeout(() => playBeep(880, 'triangle', 0.25), 200);
    }
    function playWrongSound() {
      playBeep(210, 'sawtooth', 0.2);
      setTimeout(() => playBeep(140, 'sawtooth', 0.3), 150);
    }

    const QUESTIONS = [
      {
        stage: "Seviye 1: Üçgen Eşitsizliği",
        text: "Kenar uzunlukları $6 \\text{ cm}$ ve $10 \\text{ cm}$ olan bir üçgenin üçüncü kenarı $x$ tam sayı cinsinden kaç farklı değer alabilir?",
        options: ["7", "9", "11", "15"],
        correct: 2,
        exp: "Üçgen eşitsizliği: $|10 - 6| < x < 10 + 6 \\implies 4 < x < 16$. Tam sayılar $\\{5, 6, \\dots, 15\\}$ olup $15 - 5 + 1 = 11$ farklı değer alır."
      },
      {
        stage: "Seviye 1: Pisagor Bağıntısı (3-4-5 Katları)",
        text: "Dik kenar uzunlukları $9 \\text{ cm}$ ve $12 \\text{ cm}$ olan dik üçgenin hipotenüs uzunluğu kaç cm'dir?",
        options: ["13 cm", "14 cm", "15 cm", "16 cm"],
        correct: 2,
        exp: "$3 - 4 - 5$ özel üçgeninin 3 katıdır: $3\\times 3 = 9$, $4\\times 3 = 12 \\implies 5\\times 3 = 15$ cm bulunur."
      },
      {
        stage: "Seviye 2: Özel Dik Üçgenler (5-12-13 & 8-15-17)",
        text: "Bir dik üçgende hipotenüs uzunluğu $13 \\text{ cm}$ ve bir dik kenar $5 \\text{ cm}$ ise diğer dik kenarın uzunluğu kaç cm'dir?",
        options: ["8 cm", "10 cm", "12 cm", "14 cm"],
        correct: 2,
        exp: "$5 - 12 - 13$ özel dik üçgeni kuralından diğer kenar $12$ cm'dir. ($5^2 + 12^2 = 25 + 144 = 169 = 13^2$)."
      },
      {
        stage: "Seviye 3: Üçgenlerde Benzerlik Oranı",
        text: "Benzer iki üçgenin benzerlik oranı $k = \\frac{2}{3}$'tür. Küçük üçgenin çevresi $24 \\text{ cm}$ olduğuna göre büyük üçgenin çevresi kaç cm'dir?",
        options: ["30 cm", "32 cm", "36 cm", "48 cm"],
        correct: 2,
        exp: "Çevreler oranı benzerlik oranına eşittir: $\\frac{24}{\\text{Ç}} = \\frac{2}{3} \\implies 2\\text{Ç} = 72 \\implies \\text{Ç} = 36$ cm'dir."
      },
      {
        stage: "Seviye 4: LGS Şampiyon Mimar Piramidi",
        text: "Aralarındaki uzaklık $15$ metre olan iki dikey direkte; kısa direğin boyu $7$ metre, uzun direğin boyu $15$ metredir. Bu iki direğin tepe noktaları arasına gerilen telin uzunluğu kaç metredir?",
        options: ["15 m", "17 m", "19 m", "20 m"],
        correct: 1,
        exp: "Dikey fark $= 15 - 7 = 8$ metre. Yatay mesafe $= 15$ metre. $8 - 15 - 17$ özel dik üçgeninden telin uzunluğu $17$ metredir."
      }
    ];

    let currentQ = 0;
    let score = 0;
    let floors = 0;
    let answered = false;

    function renderCurrentQuestion() {
      answered = false;
      const q = QUESTIONS[currentQ];
      
      document.getElementById('stage-badge').innerHTML = `🏗️ ${q.stage}`;
      document.getElementById('question-text').innerHTML = q.text;
      document.getElementById('level-pill').innerText = `Soru ${currentQ + 1} / ${QUESTIONS.length}`;
      
      const pct = Math.round(((currentQ + 1) / QUESTIONS.length) * 100);
      document.getElementById('progress-bar').style.width = `${pct}%`;

      const fb = document.getElementById('feedback-banner');
      fb.classList.add('hidden');

      const grid = document.getElementById('options-grid');
      grid.innerHTML = q.options.map((opt, i) => `
        <button onclick="handleSelect(${i})" class="pyramid-card p-4 sm:p-5 rounded-2xl bg-orange-950/70 border border-orange-500/30 text-white font-bold text-left flex items-center gap-3">
          <span class="w-8 h-8 rounded-xl bg-orange-900/80 border border-orange-400/40 text-orange-300 flex items-center justify-center text-xs shrink-0 font-fredoka">
            ${['A', 'B', 'C', 'D'][i]}
          </span>
          <span class="text-sm sm:text-base flex-1">${opt}</span>
        </button>
      `).join('');

      renderMath();
    }

    function handleSelect(index) {
      if (answered) return;
      answered = true;
      const q = QUESTIONS[currentQ];
      const isCorrect = (index === q.correct);
      const fb = document.getElementById('feedback-banner');
      const msg = document.getElementById('feedback-msg');
      const exp = document.getElementById('feedback-explanation');

      fb.classList.remove('hidden');

      if (isCorrect) {
        playCorrectSound();
        score += 35;
        floors += 1;
        document.getElementById('hud-score').innerText = score;
        document.getElementById('hud-floors').innerText = `${floors} 🏛️`;
        
        fb.className = "p-4 rounded-2xl border text-center text-sm font-bold space-y-2 bg-emerald-950/80 border-emerald-500 text-emerald-300 animate-fadeIn";
        msg.innerHTML = "🏛️ Piramidin Kilit Taşı Yerine Oturdu!";
        confetti({ particleCount: 45, spread: 75, origin: { y: 0.7 } });
      } else {
        playWrongSound();
        fb.className = "p-4 rounded-2xl border text-center text-sm font-bold space-y-2 bg-rose-950/80 border-rose-500 text-rose-300 animate-fadeIn";
        msg.innerHTML = `⚠️ Taş Yuvarlandı! Doğru Cevap: ${['A', 'B', 'C', 'D'][q.correct]}`;
      }

      exp.innerHTML = `<strong>Geometrik Çözüm:</strong> ${q.exp}`;
      renderMath();
    }

    function nextQuestion() {
      currentQ++;
      if (currentQ < QUESTIONS.length) {
        renderCurrentQuestion();
      } else {
        showGameOver();
      }
    }

    function showGameOver() {
      confetti({ particleCount: 140, spread: 95, origin: { y: 0.6 } });
      const card = document.getElementById('game-card');
      card.innerHTML = `
        <div class="text-center space-y-5 py-6">
          <div class="text-6xl animate-bounce">🏛️</div>
          <h2 class="text-3xl font-black text-white font-fredoka">Büyük Piramit Mimarı!</h2>
          <p class="text-orange-200 text-sm max-w-md mx-auto">
            Tebrikler! Pisagor bağıntısı, özel üçgenler ve üçgen benzerliğini ustalıkla kullanarak Krallığın En Büyük Piramidini başarıyla inşa ettin.
          </p>
          <div class="inline-flex items-center gap-6 p-4 rounded-2xl bg-orange-950/70 border border-orange-500/40">
            <div>
              <div class="text-xs text-orange-400">Toplam Mimarlık Puanı</div>
              <div class="text-2xl font-black text-amber-400">${score}</div>
            </div>
            <div class="w-px h-8 bg-orange-500/30"></div>
            <div>
              <div class="text-xs text-orange-400">İnşa Edilen Kat</div>
              <div class="text-2xl font-black text-orange-300">${floors} / ${QUESTIONS.length} 🏛️</div>
            </div>
          </div>
          <div class="flex flex-wrap items-center justify-center gap-3 pt-4">
            <button onclick="location.reload()" class="px-5 py-3 rounded-2xl bg-gradient-to-r from-orange-600 via-amber-500 to-yellow-400 hover:brightness-110 text-slate-950 font-black text-xs shadow-lg transition-all">
              🔄 Yeniden Oyna
            </button>
            <a href="../index.html" class="px-5 py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-orange-200 font-bold text-xs border border-orange-500/30 transition-all">
              🎮 Diğer Oyunları Keşfet
            </a>
          </div>
        </div>
      `;
      renderMath();
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderCurrentQuestion();
    });
  </script>
</body>
</html>
